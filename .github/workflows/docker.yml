# Builds the Docker image, runs the backend tests and an end-to-end smoke test inside it, and publishes it to the
# GitHub Container Registry (ghcr.io/j-nivekk/stepthrough).
#
#   push to `main`               -> :edge and :sha-<commit>
#   push a tag such as v1.0.0    -> :1.0.0, :1.0 and :stable
#   pull requests                -> test only, nothing published
#
# Each tag is published with `-ocr` behind it too, as the same image: text recognition used to come in an image of its
# own (until 1.4.5), and a server that follows `stable-ocr` must go on getting updates.
#
# Pushes and pull requests run only when they change something the image or its tests are built from (the `paths`
# lists below): documentation, the nginx example and the evaluation write-ups do not. Release tags always run, as
# GitHub does not apply path filters to tags. For other small changes, put [skip ci] in the commit message.
#
# Publishing uses the workflow's own GITHUB_TOKEN, so no personal registry credentials are stored in the repository.

name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "!backend/tests/**/*.md"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/**"
      - "!frontend/**/*.md"
      - "docker/Dockerfile"
      - "docker/smoke_test.py"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "!backend/tests/**/*.md"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/**"
      - "!frontend/**/*.md"
      - "docker/Dockerfile"
      - "docker/smoke_test.py"
      - "compose.yaml"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/j-nivekk/stepthrough

jobs:
  test:
    name: Test the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the test stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: stepthrough:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

      - name: Backend tests, on the image's own ffmpeg
        run: docker run --rm stepthrough:test

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      # Text is read without a connection: the models are in the image.
      - name: Start it as deployed and run the smoke test, text recognition included
        env:
          STEPTHROUGH_TAG: ci
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose exec -T stepthrough python - --ocr < docker/smoke_test.py

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

  publish:
    name: Publish the image
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}-ocr,priority=50
            type=semver,pattern={{major}}.{{minor}}-ocr,priority=50
            type=raw,value=stable-ocr,priority=50,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge-ocr,priority=50,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,suffix=-ocr,priority=50,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
