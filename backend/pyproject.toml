[project]
name = "stepthrough-backend"
version = "0.1.0"
description = "Local-first backend for walkthrough screenshot extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=2.1.0",
  "opencv-contrib-python==4.10.0.84",
  "pillow>=10.4.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0"
]

# Optional text recognition for step screenshots (ocr_text in exports): uv sync --group ocr
# Bump paddlepaddle and paddleocr together and test on x86 first: see "PaddlePaddle version bugs" in README.md.
ocr = [
  "paddlepaddle==3.3.0",
  "paddleocr==3.3.0",
  "setuptools>=70.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "smoke: requires a real PaddleOCR 3.x backend environment"
]
