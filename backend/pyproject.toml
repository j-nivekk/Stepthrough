[project]
name = "stepthrough-backend"
version = "1.5.2"
description = "Local-first backend for walkthrough screenshot extraction"
authors = [{ name = 'H. "Kevin" Jin', email = "h.jin@terminallyonline.nl" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=2.1.0",
  "opencv-contrib-python==4.10.0.84",
  "pillow>=10.4.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0"
]

# Text recognition (app/services/text_engine.py): ONNX Runtime, and PyYAML for the models' list of characters. Installed
# by a plain `uv sync`; leave it out with `uv sync --no-group ocr`. ONNX Runtime has no packages for Intel Macs and for
# macOS before 14 (Darwin 23), so there it is left out by itself and text recognition is unavailable. (With the dot,
# '23.' is compared as text; as a version, it would trip some tools over the names of Linux kernels.)
ocr = [
  "onnxruntime==1.31.1; sys_platform != 'darwin' or (platform_machine == 'arm64' and platform_release >= '23.')",
  "pyyaml>=6.0",
]

[tool.uv]
default-groups = ["dev", "ocr"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "models: reads text with the real models, where they are (see tests/test_text_engine.py)"
]
